<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopi; Admin - User Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="Admin.css">
  <link rel="stylesheet" href="Users.css">
  <link rel="icon" href="../Customer/HomePic/Logo.png">
  <link rel="stylesheet" href="../Customer/Notices.css">
  <link rel="stylesheet" href="/Customer/Loader.css">
</head>
<body>
<script src="/Customer/Loader.js"></script>
<script src="../Customer/Notices.js"></script>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand"><img src="../Customer/HomePic/Logo.png" alt="Kopi logo"><span>Kopi;</span></div>
      <nav class="admin-nav">
        <a class="admin-nav-link" href="Dashboard.html"><i class="bi bi-house-door-fill"></i><span>Dashboard</span></a>
        <a class="admin-nav-link" href="Operation.html"><i class="bi bi-display"></i><span>Operation</span></a>
        <a class="admin-nav-link" href="Transactions.html"><i class="bi bi-receipt"></i><span>Transactions</span></a>
        <a class="admin-nav-link" href="Reports.html"><i class="bi bi-graph-up-arrow"></i><span>Sales Report</span></a>
        <a class="admin-nav-link" href="Inventory.html"><i class="bi bi-box-seam-fill"></i><span>Inventory</span></a>
        <a class="admin-nav-link" href="Menu.html"><i class="bi bi-cup-hot-fill"></i><span>Menu Management</span></a>
        <a class="admin-nav-link" href="Users.html"><i class="bi bi-people-fill"></i><span>Users</span></a>
        <a class="admin-nav-link active" href="Activity.html" aria-current="page"><i class="bi bi-clock-history"></i><span>User Activity</span></a>
        <a class="admin-nav-link" href="Settings.html"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-text"><h1>User Activity</h1><p>Who changed what in the system, and when.</p></div>
        <a class="admin-profile" href="#" aria-label="Open administrator menu"><i class="bi bi-person-circle"></i><div class="profile-text"><strong>Admin</strong><span>Administrator</span></div><i class="bi bi-chevron-down"></i></a>
      </header>

      <main class="admin-content users-content">
        <section class="users-tools activity-tools">
          <label class="users-search"><i class="bi bi-search" aria-hidden="true"></i><input id="activitySearch" type="search" placeholder="Search person, action or item..."></label>
          <select id="activityRole" aria-label="Filter by role">
            <option value="">All Roles</option>
            <option>Admin</option>
            <option>Cashier</option>
            <option>Staff</option>
            <option>Customer</option>
          </select>
          <select id="activityArea" aria-label="Filter by area"><option value="">All Areas</option></select>
          <label class="activity-date">From <input id="activityFrom" type="date"></label>
          <label class="activity-date">To <input id="activityTo" type="date"></label>
        </section>
        <p class="report-status" id="activityStatus" role="status"></p>
        <section class="users-table-card">
          <div class="table-scroll">
            <table class="users-table">
              <thead><tr><th>Date and time</th><th>Person</th><th>Role</th><th>Area</th><th>Action</th><th>Details</th></tr></thead>
              <tbody id="activityRows"></tbody>
            </table>
          </div>
          <p class="users-empty" id="activityEmpty" hidden>No activity matches these filters.</p>
          <footer class="users-footer">
            <span id="activityRange"></span>
            <nav class="pagination" aria-label="Activity pages">
              <button id="activityPrevious" type="button" aria-label="Previous page" disabled><i class="bi bi-chevron-left" aria-hidden="true"></i></button><span id="activityPage" class="page-indicator" aria-live="polite" aria-atomic="true">1/1</span><button id="activityNext" type="button" aria-label="Next page" disabled><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
            </nav>
          </footer>
        </section>
      </main>
    </div>
  </div>
  <script src="../Customer/Api.js"></script>
  <script src="AdminGuard.js"></script>
  <script src="AdminNav.js"></script>
  <script src="OrderAlerts.js"></script>
  <script src="Activity.js"></script>
  <script src="../Customer/ProfileTools.js"></script><script src="AdminProfile.js"></script>
</body>
</html>
