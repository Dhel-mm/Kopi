<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopi;Login</title>
  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="Customer/HomePic/Logo.png"/>

  <link rel="stylesheet" href="Customer/Notices.css">
</head>
<body>
<script src="Customer/Notices.js"></script>

  <div class="container">
    <img src="Customer/HomePic/Intro.JPG" alt="Kopi background" class="bg-image">
    <div class="overlay"></div>

    <img src="Customer/HomePic/Logo.png" alt="Kopi Logo" class="logo-image">

    <div class="logo">
      <h2>Kopi;</h2>
      <p>EST 2021</p>
    </div>

    <div class="login-card">
      <h2 class="card-title">Login or Sign Up</h2>

      <form id="loginForm">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="emailInput" name="email" placeholder="kopi@example.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="passwordInput" name="password" placeholder="••••••••••••••" required>
            <span class="toggle-password" data-toggle-password="passwordInput" role="button" tabindex="0" aria-label="Show or hide password">
              <i class="bi bi-eye-slash"></i>
            </span>
          </div>
        </div>

        <div class="row-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a href="reset.html" class="forgot">Forgot Password?</a>
        </div>

        <div class="login-btn">
          <button type="submit" style="background:none;border:none;color:inherit;font:inherit;width:100%;cursor:pointer;">Login</button>
        </div>
      <p id="authStatus" role="status"></p></form>

      <p class="signup-text">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>

  </div>

<script src="Customer/Api.js"></script>
<script src="Auth.js"></script>

</body>
</html>
