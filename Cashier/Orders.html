<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopi; Cashier - Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../Admin/Admin.css">
  <link rel="stylesheet" href="../Admin/Orders.css">
  <link rel="icon" href="../Customer/HomePic/Logo.png"/>
  <link rel="stylesheet" href="../Customer/Notices.css">
  <link rel="stylesheet" href="Workspace.css">
</head>
<body class="workspace-loading" data-workspace="Cashier" data-page="orders" data-title="Cashier Orders" data-subtitle="Take an order. Make someone’s day.">
<script src="../Customer/Notices.js"></script>

  <div class="workspace-gate" id="workspaceGate" role="status">Opening your workspace…</div>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="workspaceSidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar" id="workspaceHeader"></header>

      <div class="admin-content orders-content">
        <div class="orders-layout">

          <div class="orders-main">
            <div class="orders-body">
              <aside class="category-list" id="categoryList" aria-label="Product categories"></aside>

              <div class="product-area">
                <div class="orders-toolbar">
                  <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" id="productSearch" placeholder="Search product...">
                  </div>
                  <div class="view-toggle" role="group" aria-label="Change product view">
                    <button type="button" class="view-btn active" data-view="grid" aria-label="Grid view">
                      <i class="bi bi-grid-3x3-gap-fill"></i>
                    </button>
                    <button type="button" class="view-btn" data-view="list" aria-label="List view">
                      <i class="bi bi-list-ul"></i>
                    </button>
                  </div>
                </div>

                <div class="product-grid" id="productGrid"></div>
              </div>
            </div>
          </div>

          <aside class="order-panel">
            <div class="order-panel-head">
              <div class="order-panel-heading">
                <span class="order-label">In-store Order</span>
                <strong id="orderNumber"># New</strong>
              </div>
              <button type="button" class="cancel-order-btn" id="cancelOrderBtn">Clear Draft</button>
            </div>

            <h2 class="order-panel-title">Current Order</h2>

            <label class="customer-field">
              Customer (Optional)
              <div class="input-with-icon">
                <i class="bi bi-person"></i>
                <input type="text" id="customerName" placeholder="Enter customer name">
              </div>
            </label>

            <div class="order-type-toggle" role="group" aria-label="Order type">
              <button type="button" class="order-type-btn active" data-type="Dine-in">Dine-in</button>
              <button type="button" class="order-type-btn" data-type="Take out">Take out</button>
            </div>

            <div class="order-items" id="orderItems">
              <p class="order-empty" id="orderEmptyMsg">No items yet. Tap a product to add it.</p>
            </div>

            <div class="order-summary-lines">
              <div class="summary-line">
                <span>Subtotal</span>
                <strong id="subtotalAmount">₱0.00</strong>
              </div>
              <div class="summary-line" id="posVoucherLine" hidden><span>Voucher deduction</span><strong id="posVoucherAmount">₱0.00</strong></div>
            </div>

            <div class="order-total-line">
              <span>Total</span>
              <strong id="orderTotal">₱0.00</strong>
            </div>

            <div class="payment-method">
              <span class="payment-label">Payment Method</span>
              <div class="payment-options">
                <button type="button" class="payment-btn active" data-method="Cash">
                  <img class="payment-logo" src="../Customer/HomePic/Cash.png" alt="">Cash
                </button>
                <button type="button" class="payment-btn" data-method="GCash">
                  <img class="payment-logo" src="../Customer/HomePic/gcash.png" alt="">GCash
                </button>
              </div>
              <div class="payment-extra" id="paymentExtra" hidden></div>
            </div>

            <div class="pos-voucher">
              <label for="posVoucherCode">Voucher code</label>
              <div class="pos-voucher-input">
                <input id="posVoucherCode" type="text" maxlength="32" placeholder="Enter voucher code" autocomplete="off" aria-describedby="posVoucherStatus">
                <button id="applyPosVoucher" type="button">Apply</button>
              </div>
              <p id="posVoucherStatus" role="status" aria-live="polite"></p>
            </div>

            <button type="button" class="place-order-btn" id="placeOrderBtn">
              <i class="bi bi-cart-check-fill"></i> Place Order
            </button>
          </aside>

        </div>
      </div>
    </div>
  </div>

  <template id="productCardTemplate">
    <article class="pos-product-card" data-product-id="">
      <div class="product-img-wrap">
        <img alt="">
        <button type="button" class="add-btn" data-action="add" aria-label="Add to order">
          <i class="bi bi-plus-lg"></i>
        </button>
      </div>
      <h3 data-product-name></h3>
      <p class="product-price" data-product-price></p>
    </article>
  </template>

  <template id="orderItemTemplate">
    <div class="order-item" data-cart-id="">
      <img alt="">
      <div class="order-item-info">
        <h4 data-item-name></h4>
        <span class="order-item-price" data-item-price></span>
      </div>
      <div class="order-item-qty">
        <button type="button" data-action="dec" aria-label="Decrease quantity"><i class="bi bi-dash"></i></button>
        <span data-item-qty>1</span>
        <button type="button" data-action="inc" aria-label="Increase quantity"><i class="bi bi-plus"></i></button>
      </div>
      <button type="button" class="order-item-delete" data-action="delete" aria-label="Remove item">
        <i class="bi bi-trash3"></i>
      </button>
    </div>
  </template>

  <script src="../Customer/Catalog.js"></script>
  <script src="../Admin/Products.js"></script>
  <script src="../Customer/Api.js"></script>
  <script src="Workspace.js"></script>
  <script src="../Admin/AdminNav.js"></script>
  <script src="Cashier.js"></script>
</body>
</html>
