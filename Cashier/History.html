<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../Admin/Admin.css">
  <link rel="stylesheet" href="../Cashier/Workspace.css">
  <link rel="stylesheet" href="../Customer/Notices.css">
  <link rel="icon" href="../Customer/HomePic/Logo.png">
  <title>Kopi; Cashier - Order History</title>
</head>
<body class="workspace-loading" data-workspace="Cashier" data-page="history" data-title="Order History" data-subtitle="In-store orders and receipts, all in one place.">
  <div class="workspace-gate" id="workspaceGate" role="status">Opening your workspace…</div>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="workspaceSidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="workspaceHeader"></header>
      <main class="workspace-content">
        <p class="workspace-intro">Review the latest 250 in-store orders. For cancellations or refunds, contact the administrator.</p>
        <div class="workspace-tools">
          <label class="workspace-search"><i class="bi bi-search" aria-hidden="true"></i><input id="historySearch" type="search" placeholder="Search order or customer…" aria-label="Search orders"></label>
          <select class="workspace-select" id="historyStatus" aria-label="Filter order status"><option value="">All statuses</option><option>Preparing</option><option>Completed</option><option>Canceled</option></select>
          <button class="workspace-btn secondary" id="refreshHistory" type="button"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Refresh</button>
          <a class="workspace-btn" href="Orders.html"><i class="bi bi-plus-lg" aria-hidden="true"></i> New order</a>
        </div>
        <p id="historyMessage" class="workspace-status" role="status" aria-live="polite"></p>
        <section class="workspace-table-card" aria-label="In-store orders">
          <div class="workspace-table-scroll">
            <table class="workspace-table"><thead><tr><th>Order ID</th><th>Customer</th><th>Service</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Time</th><th>Receipt</th></tr></thead><tbody id="historyRows"></tbody></table>
          </div>
          <p class="workspace-empty" id="historyEmpty" hidden>No matching in-store orders.</p>
          <footer class="workspace-footer"><span id="historyRange"></span><nav class="workspace-pagination" aria-label="Order history pages"><button type="button" id="historyPrevious" aria-label="Previous page">❮</button><span id="historyPage">1/1</span><button type="button" id="historyNext" aria-label="Next page">❯</button></nav></footer>
        </section>
      </main>
    </div>
  </div>
  <script src="../Customer/Notices.js"></script>
  <script src="../Customer/Api.js"></script>
  <script src="../Cashier/Workspace.js"></script>
  <script src="../Admin/AdminNav.js"></script>
  <script src="Cashier.js"></script>
</body>
</html>
