<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kopi; Change your password</title>
  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="Customer/HomePic/Logo.png">
  <link rel="stylesheet" href="Customer/Notices.css">
</head>
<body class="recovery-page">
<script src="Customer/Notices.js"></script>
  <div class="container">
    <img src="Customer/HomePic/Intro.JPG" class="bg-image" alt="">
    <div class="overlay"></div>
    <main class="login-card recovery-card">
      <h1 class="card-title">Create your own password</h1>
      <p class="recovery-description">You signed in with a temporary password. Choose your own password to continue.</p>
      <form id="changePasswordForm">
        <div class="input-group">
          <label for="temporaryPassword">Temporary password</label>
          <input id="temporaryPassword" name="currentPassword" type="password" required autocomplete="current-password" maxlength="72">
        </div>
        <div class="input-group">
          <label for="newPassword">New password (at least 8 characters)</label>
          <input id="newPassword" name="password" type="password" minlength="8" maxlength="72" required autocomplete="new-password">
        </div>
        <div class="input-group">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password">
        </div>
        <button class="login-btn recovery-submit" type="submit">Save password</button>
        <p id="authStatus" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>
  <script src="Customer/Api.js"></script>
  <script src="Auth.js"></script>
</body>
</html>
